<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Limo — Detailpagina rondleiding</title>
<style>
  :root{
    --tm-blauw:#00283C;
    --tm-oranje:#fa6432;
    --tm-oranje-zacht:#ffe2d4;
    --panel-border:#d8dde3;
    --text:#00283C;
    --muted:#5a6470;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:#ffffff;
    color:var(--text);
  }

  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:14px 14px 28px;
  }

  .intro{
    font-size:14px;
    color:var(--muted);
    margin:0 0 12px;
    line-height:1.5;
  }
  .intro b{color:var(--text);}

  /* ---------- IMAGE + HOTSPOTS ---------- */
  .screenshot-stage{
    position:relative;
    width:100%;
    border:1px solid var(--panel-border);
    border-radius:6px;
    overflow:hidden;
    line-height:0;
  }
  .screenshot-stage img{
    width:100%;
    display:block;
  }

  .hotspot{
    position:absolute;
    border:2px solid rgba(0,40,60,0.75);
    background:rgba(0,40,60,0.10);
    border-radius:4px;
    cursor:pointer;
    transition:background .15s, border-color .15s, box-shadow .15s;
  }
  .hotspot:hover, .hotspot:focus-visible{
    background:rgba(0,40,60,0.22);
    border-color:var(--tm-oranje);
    box-shadow:0 0 0 3px rgba(0,40,60,0.22);
  }
  .hotspot.active{
    background:rgba(250,100,50,0.25);
    border-color:var(--tm-oranje);
    box-shadow:0 0 0 3px rgba(250,100,50,0.30);
  }
  .hotspot .num{
    position:absolute;
    top:-11px;
    left:-11px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--tm-blauw);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  .hotspot.active .num{background:var(--tm-oranje);}

  /* ---------- FIXED EXPLANATION PANEL ---------- */
  .explain-panel{
    margin-top:16px;
    background:#ffffff;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:18px 22px;
    min-height:80px;
  }
  .explain-panel .eyebrow{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--tm-oranje);
    font-weight:700;
    margin-bottom:6px;
  }
  .explain-panel h3{
    margin:0 0 8px;
    font-size:17px;
    color:var(--text);
  }
  .explain-panel p{
    margin:0;
    font-size:14px;
    line-height:1.6;
    color:#333;
  }
  .explain-panel .placeholder{
    color:var(--muted);
    font-style:italic;
  }

  .progress-note{
    margin-top:10px;
    font-size:12.5px;
    color:var(--muted);
    text-align:right;
  }
  .progress-note b{color:var(--tm-oranje);}

  :focus-visible{outline:3px solid var(--tm-oranje);outline-offset:1px;}

  @media (max-width:640px){
    .explain-panel{padding:14px 16px;}
  }

  /* ---------- TWO-COLUMN LAYOUT ---------- */
  .outer{
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:nowrap;
  }
  .image-col{
    flex:3 1 0;
    min-width:0;
  }
  .panel-col{
    flex:1 0 220px;
    max-width:280px;
  }
  @media(max-width:760px){
    .outer{flex-direction:column;}
    .panel-col{flex:1 1 auto; max-width:none;}
  }
</style>
</head>
<body>
<div class="wrap">

<script>
const explanations = {
  availability: {
    title: "1 — Beschikbaarheid",
    text: "Hier zie je of je dit item meteen kan inkijken of ontlenen, en op welke manier. 'Beschikbaar in [bibliotheek]' betekent dat er een fysiek exemplaar is in een van de leercentra; 'Online toegang' betekent dat de volledige tekst digitaal te raadplegen is. Klik op een van deze groene links om meteen naar die informatie te springen."
  },
  bekijkonline: {
    title: "2 — Bekijk online",
    text: "Hier vind je de digitale toegangsmogelijkheden: via welke databank of platform (in dit voorbeeld: EBSCOhost Ebooks) je de volledige tekst online kan raadplegen. Via de link word je naar het juiste platform geleid."
  },
  vindplaats: {
    title: "3 — Vindplaats",
    text: "Dit gedeelte toont waar je het fysieke exemplaar kan terugvinden: op welke campus, in welke rekken (plaatskenmerk), en of het op dit moment beschikbaar of uitgeleend is. Ook het aantal exemplaren en eventuele aanvragen staan hier vermeld."
  },
  navmenu: {
    title: "4 — Navigatiemenu",
    text: "Met dit menu spring je snel naar een onderdeel van de detailpagina. 'Bekijk online' toont de digitale toegang; 'Vindplaats' toont de fysieke vindplaats; 'Details' toont de bibliografische details; 'Links' eventueel gerelateerde websites; 'Export' toont opties om citaties te exporteren of te printen."
  }
};

const stage = document.getElementById('stage');
const explainTitle = document.getElementById('explainTitle');
const explainText = document.getElementById('explainText');
const progressNote = document.getElementById('progressNote');
const seen = new Set();
const total = Object.keys(explanations).length;

function activate(hotspot){
  document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
  hotspot.classList.add('active');

  const id = hotspot.dataset.id;
  const info = explanations[id];
  if(info){
    explainTitle.textContent = info.title;
    explainText.innerHTML = info.text;
    explainText.classList.remove('placeholder');
    seen.add(id);
    progressNote.innerHTML = `<b>${seen.size}</b> van ${total} onderdelen bekeken`;
  }
}

stage.querySelectorAll('.hotspot').forEach(h => {
  h.addEventListener('click', () => activate(h));
  h.addEventListener('keypress', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(h); } });
});
</script>
